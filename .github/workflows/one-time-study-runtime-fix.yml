name: One-time study runtime fix

on:
  push:
    branches:
      - fix/today-session-ke04-finish

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/today-session-ke04-finish

      - name: Apply targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          editor = Path("src/components/AbittiAnswerEditor.tsx")
          text = editor.read_text()
          old = '    <div className={className}>'
          new = '    <div className={className} onKeyDown={(event) => event.stopPropagation()}>'
          if new not in text:
              if old not in text:
                  raise SystemExit("Abitti editor wrapper marker not found")
              text = text.replace(old, new, 1)
          editor.write_text(text)

          data = Path("src/lib/data.ts")
          text = data.read_text()
          import_line = 'import { KE04_TEXTBOOK_TOPICS } from "./ke04-textbook-topics";\n'
          anchor = 'import { DEFAULT_STUDY_WEEKDAYS } from "./studyDefaults";\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit("data.ts import anchor not found")
              text = text.replace(anchor, anchor + import_line, 1)
          replacement = "\n".join([
              "const KE04_TOPICS = KE04_TEXTBOOK_TOPICS.map(({ name, weight, importance, materials }) => ({",
              "  name,",
              "  weight,",
              "  importance,",
              "  materials,",
              "}));",
          ])
          if replacement not in text:
              pattern = re.compile(r'const KE04_TOPICS = \[\n.*?\n\] as const;', re.S)
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected one legacy KE04_TOPICS block, got {count}")
          data.write_text(text)

          v5 = Path("src/lib/learning-os-v5.ts")
          text = v5.read_text()
          old = '  }).sort((a,b)=>b.policyScore-a.policyScore);'
          new = "\n".join([
              "  }).sort((a,b)=>{",
              "    const aTodayPlan=a.planItem?.date===now&&a.planItem.status===\"planned\"?1:0;",
              "    const bTodayPlan=b.planItem?.date===now&&b.planItem.status===\"planned\"?1:0;",
              "    if(aTodayPlan!==bTodayPlan)return bTodayPlan-aTodayPlan;",
              "    return b.policyScore-a.policyScore;",
              "  });",
          ])
          if new not in text:
              if old not in text:
                  raise SystemExit("V5 policy sort marker not found")
              text = text.replace(old, new, 1)
          v5.write_text(text)
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit fixes to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AbittiAnswerEditor.tsx src/lib/data.ts src/lib/learning-os-v5.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Today plan priority and study editor navigation"
          git push origin HEAD:fix/today-session-ke04-finish
