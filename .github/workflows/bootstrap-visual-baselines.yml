name: Bootstrap Visual Baselines

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-visual-baselines.yml"
      - ".github/visual-baseline-bootstrap.trigger"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: https://opiskelupaivakirja.vercel.app
      EXPECTED_PRODUCTION_SHA: 37c6b4bd78647f64da26c3d756e1e554e250430e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production baseline commit
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --silent --show-error --fail --max-time 10 "$E2E_BASE_URL/api/release-info")
          LIVE_SHA=$(printf '%s' "$BODY" | python3 -c "import json,sys; print((json.load(sys.stdin).get('commit') or '').strip())")
          if [ "$LIVE_SHA" != "$EXPECTED_PRODUCTION_SHA" ]; then
            echo "::error::Production serves '${LIVE_SHA:-unknown}', expected $EXPECTED_PRODUCTION_SHA"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright test runner
        run: bun add --no-save @playwright/test@latest

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Generate shell baselines
        run: bunx playwright test e2e/visual-regression.spec.ts --project=desktop-chromium --update-snapshots

      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        with:
          name: bootstrapped-visual-baselines
          path: e2e/visual-regression.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 7

      - name: Publish clean baseline branch
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          cp -a e2e/visual-regression.spec.ts-snapshots "$TMP_DIR/"

          git fetch origin main
          git checkout -B test/visual-regression-baselines origin/main
          rm -rf e2e/visual-regression.spec.ts-snapshots
          mkdir -p e2e
          cp -a "$TMP_DIR/visual-regression.spec.ts-snapshots" e2e/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual-regression.spec.ts-snapshots
          git diff --cached --quiet && exit 0
          git commit -m "Add production visual regression baselines"
          git push --force origin HEAD:refs/heads/test/visual-regression-baselines
