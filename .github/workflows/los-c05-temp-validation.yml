name: LOS C05 temporary branch validation

on:
  push:
    branches:
      - feat/los1-teacher-l022-l026

permissions:
  contents: read

jobs:
  types-tests-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Generate routes and typecheck
        run: bun run typecheck
      - name: Complete unit suite
        run: bun run test
      - name: Production build
        run: bun run build

  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run e2e:install
      - run: bunx playwright install --with-deps chromium webkit
      - name: Start local app
        shell: bash
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-c05-dev.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:5173/ > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/los-c05-dev.log
          exit 1
      - name: C04 Teacher interactions on desktop and iPhone
        run: bunx playwright test e2e/los-c04-teacher.spec.ts --project=desktop-chromium --project=iphone-webkit
      - name: Combined C03-C05 Teacher flows and entire lesson path on both browsers
        run: bunx playwright test e2e/los-full-book.spec.ts --grep 'C03|C04|C05|L013|L014|L015|L016|L017|L018|L019|L020|L021|every one of the 60 guided lessons' --project=desktop-chromium --project=iphone-webkit
