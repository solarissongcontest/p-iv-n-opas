name: LOS Teacher L001-L030 integration verification

on:
  push:
    branches:
      - feat/los1-teacher-integrated-l001-l030-20261113

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run e2e:install
      - run: bunx playwright install --with-deps chromium webkit
      - name: Start local preview
        shell: bash
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-integration-dev.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:5173/ > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/los-integration-dev.log
          exit 1
      - name: Teacher C04 C05 Review I and all 60 lessons on both browser projects
        run: bunx playwright test e2e/los-c04-teacher.spec.ts e2e/los-teacher-review-midterm.spec.ts e2e/los-full-book.spec.ts --grep 'C04|C05|L02[7-9]|L030|EX-MID|every one of the 60 guided lessons' --project=desktop-chromium --project=iphone-webkit
