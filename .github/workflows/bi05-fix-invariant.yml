name: BI05 Fix Invariant

on:
  push:
    branches:
      - feature/bi05-release-clean
    paths:
      - .github/workflows/bi05-fix-invariant.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bi05-release-clean
          fetch-depth: 0
      - name: Patch chapter 5 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('supabase/migrations/20261007190300_bi05_question_bank_v1.sql'),
              Path('supabase/migrations/20261007190400_bi05_question_bank_v2.sql'),
          ]:
              text = path.read_text()
              old = "split_part(t.name,'.',1)::integer=5 and (q.exam_eligible or q.reserve_for_exam)"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one brittle chapter check, got {count}')
              text = text.replace(old, "(q.metadata->>'chapter')::integer=5 and (q.exam_eligible or q.reserve_for_exam)")
              path.write_text(text)
          PY
      - name: Run regression tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Commit and clean helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bi05-fix-invariant.yml
          rm -f package-lock.json
          git restore src/routeTree.gen.ts 2>/dev/null || true
          git add -A
          git commit -m "Harden BI05 chapter invariants"
          git push origin HEAD:feature/bi05-release-clean
