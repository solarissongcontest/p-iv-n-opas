name: LOS! 1 curated photo import (temporary)

on:
  push:
    branches:
      - feat/los1-photo-assets-local-v1
    paths:
      - "scripts/los1-optimize-chapter-photos.py"
      - ".github/workflows/los1-import-curated-photos.yml"

permissions:
  contents: write

jobs:
  curated-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for lossless source inspection and WebP resizing
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<12"
      - name: Import exactly ten explicitly selected Pexels photos
        run: python scripts/los1-optimize-chapter-photos.py
      - name: Validate generated image sizes and count
        shell: bash
        run: |
          test "$(find public/los/chapters -maxdepth 1 -name 'LOS1-C*-desktop.webp' | wc -l)" -eq 10
          test "$(find public/los/chapters -maxdepth 1 -name 'LOS1-C*-mobile.webp' | wc -l)" -eq 10
          test -s public/los/chapters/sources-manifest.json
      - name: Commit verified local image variants to the same PR branch
        shell: bash
        run: |
          git config user.name "LOS Asset Import Bot"
          git config user.email "los-asset-import@users.noreply.github.com"
          git add public/los/chapters/
          if git diff --cached --quiet; then
            echo "All chapter image assets already match the manifest."
          else
            git commit -m "assets(los1): store 20 optimized local chapter photos with provenance"
            git push origin HEAD:feat/los1-photo-assets-local-v1
          fi
