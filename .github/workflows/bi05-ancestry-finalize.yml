name: BI05 Ancestry Finalize

on:
  push:
    branches:
      - feature/bi05-iiris5-course-system
    paths:
      - .github/workflows/bi05-ancestry-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bi05-iiris5-course-system
          fetch-depth: 0

      - name: Guard exact reconciliation state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-canonical-repo.mjs
          git merge-base --is-ancestor ce3373b202f1a01f16853073adeb0a74feeb1108 HEAD || {
            echo "::error::Expected reconciled BI05 commit is no longer in branch history."
            exit 1
          }
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3799b4701b376e4a6991e4b9aa6616154f1fef7c" || {
            echo "::error::main moved again; semantic reconciliation must be repeated before merging ancestry."
            exit 1
          }

      - name: Record latest main as merged
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge -s ours --no-edit origin/main -m "Merge latest main into BI05 feature"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Vercel build parity
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Remove one-shot workflow and build artifacts
        run: |
          set -euo pipefail
          rm -f .github/workflows/bi05-ancestry-finalize.yml
          rm -f package-lock.json
          git restore src/routeTree.gen.ts 2>/dev/null || true
          git add -A
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = ".github/workflows/bi05-ancestry-finalize.yml" || {
            echo "::error::Verification produced unexpected tracked changes."
            git status --short
            exit 1
          }
          git commit -m "Remove one-shot BI05 ancestry helper"

      - name: Push reconciled branch
        run: git push origin HEAD:feature/bi05-iiris5-course-system
