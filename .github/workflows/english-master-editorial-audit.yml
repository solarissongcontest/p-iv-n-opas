name: English Master Editorial Content Inventory

on:
  pull_request:
    paths:
      - "scripts/audit_english_master_content.py"
      - "scripts/export_english_grammar_review.py"
      - "scripts/export_english_grammar_g05_g10.py"
      - "public/english-master/**"
      - ".github/workflows/english-master-editorial-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit_english_master_content.py"
      - "public/english-master/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-audit:
    name: Audit real Alpha 0.8 lesson and chapter content
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify the signed-off content pack and measure editorial gaps
        run: python3 scripts/audit_english_master_content.py
      - name: Export verified G01-G04 original source for editorial review
        run: python3 scripts/export_english_grammar_review.py
      - name: Export original G05–G10 grammar chapter manuscripts and referenced lessons
        run: python3 scripts/export_english_grammar_g05_g10.py
      - name: Upload complete inventory and review queue
        uses: actions/upload-artifact@v4
        with:
          name: english-master-editorial-inventory
          path: |
            test-results/english-master-editorial-audit.json
            test-results/english-master-editorial-audit.md
            test-results/english-grammar-g01-g04-source.json
            test-results/english-grammar-g05-g10-source.json
          retention-days: 30
          if-no-files-found: error
