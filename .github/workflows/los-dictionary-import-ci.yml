name: LOS Dictionary Importer QA

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/los-dictionary-import.py"
      - "scripts/tests/test_los_dictionary_import.py"
      - ".github/workflows/los-dictionary-import-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-license-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic import + rights isolation tests
        run: python -m unittest discover -s scripts/tests -p 'test_los_dictionary_import.py' -v
      - name: Verify no raw dictionaries are shipped in public browser assets
        shell: bash
        run: |
          set -euo pipefail
          if find public -type f \( -name '*.tei' -o -name '*freedict*.jsonl*' -o -name '*kaikki*.jsonl*' \) | grep -q .; then
            echo "::error::Raw dictionary found in public/; importer output belongs server-side only."
            exit 1
          fi

  freedict-source-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official TEI source bytes into ephemeral CI workspace only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/los-u2-sources
          curl --fail --location --retry 2 --max-time 120 --silent --show-error \
            "https://download.freedict.org/generated/deu-fin/deu-fin.tei" \
            --output /tmp/los-u2-sources/deu-fin.tei
          curl --fail --location --retry 2 --max-time 120 --silent --show-error \
            "https://download.freedict.org/generated/fin-deu/fin-deu.tei" \
            --output /tmp/los-u2-sources/fin-deu.tei
          test "$(stat -c %s /tmp/los-u2-sources/deu-fin.tei)" -lt 30000000
          test "$(stat -c %s /tmp/los-u2-sources/fin-deu.tei)" -lt 30000000
      - name: Inspect actual rows, translations, and SHA512 without licence approval or publishing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/los-dictionary-import.py --kind freedict --direction de-fi \
            --source-id freedict-de-fi-inspection --source /tmp/los-u2-sources/deu-fin.tei \
            --mode inspect | tee /tmp/los-u2-sources/de-fi-report.json
          python scripts/los-dictionary-import.py --kind freedict --direction fi-de \
            --source-id freedict-fi-de-inspection --source /tmp/los-u2-sources/fin-deu.tei \
            --mode inspect | tee /tmp/los-u2-sources/fi-de-report.json
      - name: Store only inspection counts and hashes, never raw dictionary files
        uses: actions/upload-artifact@v4
        with:
          name: los-u2-freedict-source-inspection
          path: /tmp/los-u2-sources/*-report.json
          retention-days: 7
      - name: Parse real FreeDict sources with pinned evidence into ephemeral staging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/los-u2-sources')
          approvals = json.loads(Path('docs/LOS_U2_FREEDICT_STAGING_SOURCE_APPROVALS.json').read_text())
          for entry in approvals['entries']:
              direction = entry['direction']
              source = root / ('deu-fin.tei' if direction == 'de-fi' else 'fin-deu.tei')
              staged = root / (direction + '-staged.jsonl')
              approval = root / (direction + '-approval.json')
              import hashlib
              real_sha = hashlib.sha512(source.read_bytes()).hexdigest()
              assert real_sha == entry['sourceSha512'], (
                  f"Source bytes changed in {direction}: {real_sha} vs {entry['sourceSha512']}")
              approval.write_text(json.dumps({key: entry[key] for key in
                  ('sourceId','kind','sourceSha512','rightsApproval')}))
              command = [
                'python','scripts/los-dictionary-import.py','--kind','freedict',
                '--direction',direction,'--source',str(source),
                '--source-id',entry['sourceId'],'--mode','import',
                '--approval',str(approval),'--output',str(staged),
              ]
              subprocess.run(command, check=True)
              report = json.loads(Path(str(staged)+'.manifest.json').read_text())
              assert report['status'] == 'STAGED_NOT_PUBLISHED'
              assert report['sourceSha512'] == entry['sourceSha512']
              assert report['importedSourceRows'] > 10000, report
              assert report['translationVariants'] > 1000, report
              assert report['rowsWithTranslations'] > 1000, report
              print('ACTUAL SOURCE IMPORT COUNTS',direction, json.dumps({
                'rows':report['importedSourceRows'],
                'translatedRows':report['rowsWithTranslations'],
                'translationVariants':report['translationVariants'],
                'distinctLemmaAndPos':report['distinctLemmaAndPos'],
                'outputSha512':report['outputSha512'],
              },ensure_ascii=False))
          PY
      - name: Archive actual counts and source hashes only; NO corpus publication
        uses: actions/upload-artifact@v4
        with:
          name: los-u2-real-source-staging-metrics
          path: /tmp/los-u2-sources/*-staged.jsonl.manifest.json
          retention-days: 7
