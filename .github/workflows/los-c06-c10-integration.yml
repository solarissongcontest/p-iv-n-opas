name: LOS C06-C10 Unified Teacher Draft QA
on:
  push:
    branches:
      - feat/los1-teacher-c06-c10-integration
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: los-c06-c10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: All unit tests, TypeScript, production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Complete repository test suite
        run: bun run test
      - name: TypeScript
        run: bun run typecheck
      - name: Production build
        run: bun run build
  browser:
    name: C06-C10 and full LOS 1, Chromium/iPhone WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run e2e:install
      - run: bunx playwright install --with-deps chromium webkit
      - name: Isolated local preview
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-c06-c10-dev.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl --silent --fail --max-time 3 http://127.0.0.1:5173/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/los-c06-c10-dev.log
          exit 1
      - name: C06-C10 five complete chapter browser suites
        run: bunx playwright test e2e/los-c06-teacher.spec.ts e2e/los-c07-teacher.spec.ts e2e/los-c08-teacher.spec.ts e2e/los-c09-teacher.spec.ts e2e/los-c10-teacher.spec.ts --project=desktop-chromium --project=iphone-webkit
      - name: All digital textbook browser regressions
        run: bunx playwright test e2e/los-full-book.spec.ts --project=desktop-chromium --project=iphone-webkit
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: los-c06-c10-browser-evidence
          path: |
            test-results/
            /tmp/los-c06-c10-dev.log
          if-no-files-found: ignore
          retention-days: 7
