name: BI05 Production Migration

on:
  push:
    branches:
      - feature/bi05-iiris5-course-system
    paths:
      - .github/workflows/bi05-production-migrate.yml

permissions:
  contents: read

concurrency:
  group: bi05-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify BI05 migrations
    if: ${{ github.repository == 'solarissongcontest/p-iv-n-opas' && github.ref == 'refs/heads/feature/bi05-iiris5-course-system' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Canonical repository guard
        run: node scripts/assert-canonical-repo.mjs

      - name: Validate target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${POSTGRES_URL:-}" || { echo "::error::POSTGRES_URL is missing"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ['POSTGRES_URL'])
          if parsed.scheme not in {'postgres','postgresql'} or not parsed.hostname:
              raise SystemExit('::error::POSTGRES_URL is invalid')
          print(f'Database target host: {parsed.hostname}')
          PY
          psql --version

      - name: Apply BI05 atomically
        shell: bash
        run: |
          set -euo pipefail
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/migrations/20261007184500_bi05_iiris5_multi_exam.sql
          \i supabase/migrations/20261007190000_bi05_core_vocabulary_1.sql
          \i supabase/migrations/20261007190100_bi05_core_vocabulary_2.sql
          \i supabase/migrations/20261007190200_bi05_core_vocabulary_3.sql
          \i supabase/migrations/20261007190300_bi05_question_bank_v1.sql
          \i supabase/migrations/20261007190400_bi05_question_bank_v2.sql
          COMMIT;
          SQL

      - name: Record exact migration versions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 migration repair --help >/dev/null
          npx --yes supabase@2.117.0 migration repair \
            20261007184500 \
            20261007190000 \
            20261007190100 \
            20261007190200 \
            20261007190300 \
            20261007190400 \
            --status applied \
            --db-url "$POSTGRES_URL"

      - name: Verify BI05 production invariants
        shell: bash
        run: |
          set -euo pipefail
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            c record;
            n integer;
            w numeric;
          begin
            for c in
              select c.id,c.owner_id
              from public.courses c
              join public.user_preferences p on p.owner_id=c.owner_id and p.onboarding_completed=true
              where upper(c.code)='BI05'
            loop
              select count(*),sum(weight) into n,w from public.topics where course_id=c.id;
              if n<>63 then raise exception 'BI05 topics expected 63, got %',n; end if;
              if abs(w-100)>0.001 then raise exception 'BI05 topic weights expected 100, got %',w; end if;

              select count(*) into n from public.topics where course_id=c.id and school_covered=true;
              if n<>1 then raise exception 'BI05 school-covered topics expected 1, got %',n; end if;
              if not exists(select 1 from public.topics where course_id=c.id and name='1.1 Kudokset' and school_covered=true) then
                raise exception 'BI05 1.1 Kudokset must be school-covered';
              end if;

              select count(*) into n from public.exams where course_id=c.id and name in ('BI05 koe 1','BI05 koe 2');
              if n<>2 then raise exception 'BI05 exams expected 2, got %',n; end if;

              select count(*) into n
              from public.exam_topic_scopes s
              join public.exams e on e.id=s.exam_id
              join public.topics t on t.id=s.topic_id
              where e.course_id=c.id and split_part(t.name,'.',1)::integer=5
                and s.status='excluded' and s.confidence='confirmed';
              if n<>12 then raise exception 'BI05 confirmed chapter-5 exclusions expected 12, got %',n; end if;

              select count(*) into n from public.course_concepts where course_id=c.id;
              if n<>183 then raise exception 'BI05 concepts expected 183, got %',n; end if;

              select count(*) into n from public.question_bank where course_id=c.id and seed_version='bi05-v1' and status='retired';
              if n<>630 then raise exception 'BI05 retired V1 questions expected 630, got %',n; end if;
              select count(*) into n from public.question_bank where course_id=c.id and seed_version='bi05-v2' and status='active';
              if n<>630 then raise exception 'BI05 active V2 questions expected 630, got %',n; end if;

              select count(*) into n
              from public.question_bank q join public.topics t on t.id=q.topic_id
              where q.course_id=c.id and q.seed_version='bi05-v2'
                and split_part(t.name,'.',1)::integer=5
                and (q.exam_eligible or q.reserve_for_exam);
              if n<>0 then raise exception 'BI05 chapter 5 leaked into exams: %',n; end if;

              select count(*) into n from public.question_bank where course_id=c.id and seed_version='bi05-v2' and answer_mode='diagram';
              if n<>63 then raise exception 'BI05 diagram tasks expected 63, got %',n; end if;
              select count(*) into n from public.question_bank where course_id=c.id and seed_version='bi05-v2' and question_type='matching';
              if n<>63 then raise exception 'BI05 matching tasks expected 63, got %',n; end if;
              select count(*) into n from public.question_bank where course_id=c.id and seed_version='bi05-v2' and question_type='application';
              if n<>126 then raise exception 'BI05 application tasks expected 126, got %',n; end if;
              select count(*) into n from public.question_bank where course_id=c.id and seed_version='bi05-v2' and metadata->>'researchSkill'='true';
              if n<>27 then raise exception 'BI05 research tasks expected 27, got %',n; end if;
            end loop;

            select count(*) into n
            from public.courses c
            join public.user_preferences p on p.owner_id=c.owner_id and p.onboarding_completed=true
            where upper(c.code)='BI05';
            if n<>1 then raise exception 'Expected exactly one active-profile BI05 course, got %',n; end if;
          end
          $$;

          select c.code,c.name,c.start_date,c.exam_date,c.target_value,
                 count(distinct t.id) as topics,
                 count(distinct e.id) as exams
          from public.courses c
          left join public.topics t on t.course_id=c.id
          left join public.exams e on e.course_id=c.id
          where upper(c.code)='BI05'
          group by c.id,c.code,c.name,c.start_date,c.exam_date,c.target_value;
          SQL

      - name: Show migration history
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 migration list --db-url "$POSTGRES_URL"
