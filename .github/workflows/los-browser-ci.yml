name: LOS Book Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/los/**"
      - "e2e/los-full-book.spec.ts"
      - "e2e/los-reading-comprehension-v2.spec.ts"
      - "e2e/los-final-readiness.spec.ts"
      - "e2e/los-editorial-v4.spec.ts"
      - "e2e/los-teacher-2-restored.spec.ts"
      - "e2e/los-two-device-sync.spec.ts"
      - "e2e/los-c01-lessons.spec.ts"
      - "e2e/helpers.ts"
      - ".github/workflows/los-browser-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/features/los/**"
      - "e2e/los-full-book.spec.ts"
      - "e2e/los-reading-comprehension-v2.spec.ts"
      - "e2e/los-final-readiness.spec.ts"
      - "e2e/los-editorial-v4.spec.ts"
      - "e2e/los-teacher-2-restored.spec.ts"
      - "e2e/los-two-device-sync.spec.ts"
      - "e2e/los-c01-lessons.spec.ts"
      - "e2e/helpers.ts"
      - ".github/workflows/los-browser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: los-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    # Official version-pinned Playwright image includes matching Chromium, WebKit and OS dependencies.
    # Avoid apt installation hangs that previously cancelled the browser QA without running tests.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Install Bun and FreeDict archive prerequisites in the Playwright container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends unzip xz-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked project dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright test runner and axe
        run: bun run e2e:install

      - name: Verify bundled Chromium and WebKit browser engines
        run: |
          bunx playwright --version
          node -e "const fs=require('fs');for(const f of ['chromium','webkit']){const p=process.env.PLAYWRIGHT_BROWSERS_PATH||'/ms-playwright';if(!fs.existsSync(p))process.exit(1);console.log(f+' browser cache available in '+p)}"

      - name: Verify and prepare real FreeDict dictionary data for browser QA
        run: node scripts/import-los-freedict.mjs --strict

      - name: Start independent local preview
        shell: bash
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-browser-dev.log 2>&1 &
          echo $! > /tmp/los-browser-dev.pid
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "Independent local preview is serving on :5173"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/los-browser-dev.log
          echo "::error::Local LOS! preview did not start"
          exit 1

      - name: Full LOS! 1 browser flows in mobile WebKit and desktop Chromium
        run: bunx playwright test e2e/los-full-book.spec.ts e2e/los-reading-comprehension-v2.spec.ts e2e/los-final-readiness.spec.ts e2e/los-two-device-sync.spec.ts e2e/los-editorial-v4.spec.ts e2e/los-teacher-2-restored.spec.ts --project=desktop-chromium --project=iphone-webkit

      - name: Upload browser traces and preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: los-book-browser-evidence-${{ github.run_id }}
          path: |
            test-results/
            /tmp/los-browser-dev.log
          if-no-files-found: ignore
          retention-days: 14
