name: LOS Final Teacher Draft QA
on:
  push:
    branches:
      - feat/los1-teacher-l056-l060-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Repository unit and Teacher final regression tests
        run: bun run test
      - name: TypeScript and production build
        run: bun run build

  final-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install browser test tools
        run: bun run e2e:install
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Start local-only preview
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-final-dev.log 2>&1 &
          for attempt in $(seq 1 45); do
            curl --silent --fail --max-time 3 http://127.0.0.1:5173/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/los-final-dev.log
          exit 1
      - name: Final Teacher scenarios, C10 and 60-lesson navigation on Chromium and WebKit
        run: |
          bunx playwright test e2e/los-final-teacher.spec.ts e2e/los-c10-teacher.spec.ts --project=desktop-chromium --project=iphone-webkit
          bunx playwright test e2e/los-full-book.spec.ts --grep "L016 does not count draft C03 test" --project=desktop-chromium --project=iphone-webkit
          bunx playwright test e2e/los-full-book.spec.ts --grep "every one of the 60 guided lessons" --project=desktop-chromium --project=iphone-webkit
      - name: Save diagnostic browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: los-final-teacher-browser-evidence
          path: |
            test-results/
            /tmp/los-final-dev.log
          if-no-files-found: ignore
          retention-days: 7
