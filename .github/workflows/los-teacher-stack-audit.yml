name: LOS Teacher stacked integration dry run

on:
  push:
    branches:
      - feat/los1-teacher-stack-qa-20261113
      - feat/los1-teacher-stack-archive-20261113

permissions:
  contents: read

jobs:
  merge-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run full Teacher lesson stack without publishing or pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LOS Integration QA"
          git config user.email "los-integration-qa@users.noreply.github.com"
          branches=(
            feat/los1-teacher-l027-l030
            feat/los1-teacher-l031-l035
            feat/los1-teacher-l036-l040
            feat/los1-teacher-l041-l045
            feat/los1-teacher-l046-l050
            feat/los1-teacher-l051-l055
            feat/los1-teacher-l056-l060
          )
          for branch in "${branches[@]}"; do
            echo "::group::Merge $branch"
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git merge --no-ff --no-edit -m "Dry-run integration of $branch" "origin/$branch"; then
              echo "Git found overlapping branch edits; attempting only strictly reviewed content resolutions."
              python3 scripts/resolve_los_teacher_stack_conflicts.py
              git commit --no-edit -m "Dry-run resolved integration of $branch"
            fi
            echo "Merged $branch into temporary CI workspace"
            echo "::endgroup::"
          done
          echo "All Teacher branches merged cleanly in disposable runner."
      - name: Inspect merged Teacher assessment JSX around conflict boundaries
        run: |
          nl -ba src/features/los/teacher/LosTeacherPlayer.tsx | sed -n '445,530p'
          git status --short
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Install Playwright and accessibility tooling
        run: bun run e2e:install
      # Dependencies are now available. Parse specs before installing browsers.
      - name: Parse merged Teacher browser suites before browser installation
        run: bunx playwright test e2e/los-full-book.spec.ts e2e/los-teacher-integrated-stack.spec.ts e2e/los-teacher-review-midterm.spec.ts e2e/los-c07-teacher.spec.ts e2e/los-c10-teacher.spec.ts --list --project=desktop-chromium
      - name: Install desktop Chromium and iPhone WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Start locally merged LOS preview
        shell: bash
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-teacher-stack-preview.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:5173/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/los-teacher-stack-preview.log
          exit 1
      - name: Open every merged LOS Teacher lesson in desktop and iPhone browser
        run: bunx playwright test e2e/los-teacher-integrated-stack.spec.ts --project=desktop-chromium --project=iphone-webkit
      - name: Digital textbook and original 60-lesson browser regression
        run: bunx playwright test e2e/los-full-book.spec.ts --project=desktop-chromium --project=iphone-webkit
      - name: Midterm, C07 and C10 interactive browser regressions
        run: bunx playwright test e2e/los-teacher-review-midterm.spec.ts e2e/los-c07-teacher.spec.ts e2e/los-c10-teacher.spec.ts --project=desktop-chromium --project=iphone-webkit
      # The tested code exists only in this disposable runner. Archive the exact
      # post-merge tree for reviewers without publishing or moving any branch.
      - name: Package non-published merged Teacher source snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Never claim HEAD matches the tested workspace when generated
          # conflict resolutions were accidentally left uncommitted.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git status --short
            echo "::error::Merged Teacher source contains uncommitted tracked changes; cannot archive HEAD as the tested source."
            exit 1
          fi
          mkdir -p /tmp/los-teacher-merge-review
          git archive --format=tar HEAD | gzip -n -9 > /tmp/los-teacher-merge-review/merged-source.tar.gz
          sha256sum /tmp/los-teacher-merge-review/merged-source.tar.gz > /tmp/los-teacher-merge-review/SHA256SUMS
          {
            echo "LOS! 1 Teacher 2.0 · CI-only integrated preview"
            echo "NOT a published build, pedagogical approval or production release."
            echo "Workflow branch: ${GITHUB_REF_NAME}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Tested temporary merge commit: $(git rev-parse HEAD)"
            echo "Tested temporary merge tree: $(git rev-parse HEAD^{tree})"
            echo "Compressed source checksum: see SHA256SUMS"
            echo ""
            echo "Merged commit parents and summary:"
            git log --format="%H %P %s" -n 16
          } > /tmp/los-teacher-merge-review/PROVENANCE.txt
          test -s /tmp/los-teacher-merge-review/merged-source.tar.gz
          test -s /tmp/los-teacher-merge-review/PROVENANCE.txt
          test -s /tmp/los-teacher-merge-review/SHA256SUMS
      - name: Upload tested Teacher source for manual review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: los-teacher-stack-merged-preview
          path: /tmp/los-teacher-merge-review/
          if-no-files-found: error
          retention-days: 7
      - name: Show final merged full-book test structure if CI fails
        if: failure()
        shell: bash
        run: |
          echo "Integration test source tail, for debugging merge-resolver mistakes:"
          if [ -f e2e/los-full-book.spec.ts ]; then
            nl -ba e2e/los-full-book.spec.ts | tail -n 110
          fi
      - name: Preserve merged Teacher browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: los-teacher-stack-browser
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
