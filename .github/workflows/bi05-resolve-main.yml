name: BI05 Resolve Main

on:
  push:
    branches:
      - feature/bi05-iiris5-course-system
    paths:
      - .github/workflows/bi05-resolve-main.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BI05 branch
        uses: actions/checkout@v4
        with:
          ref: feature/bi05-iiris5-course-system
          fetch-depth: 0

      - name: Merge current main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              "src/features/maa06a/Maa06aPanels.tsx"
              "src/features/planner/PlanViewBase.tsx"
              "src/lib/data-base.ts"
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            if [ "${conflicts[*]}" != "${expected_sorted[*]}" ]; then
              printf 'Unexpected conflict set. Found:\n%s\n' "${conflicts[*]}"
              exit 1
            fi

            # Main contains the newer MAA06A manual-entry UX. BI05 branch contains
            # the multi-exam Planner and multi-topic/question-bank data contracts.
            git checkout --theirs -- src/features/maa06a/Maa06aPanels.tsx
            git checkout --ours -- src/features/planner/PlanViewBase.tsx
            git checkout --ours -- src/lib/data-base.ts
            git add src/features/maa06a/Maa06aPanels.tsx src/features/planner/PlanViewBase.tsx src/lib/data-base.ts
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          # Preserve main's MAA06A implementation while removing its single
          # trailing-space defect so the merged tree passes the repository gate.
          maa = Path('src/features/maa06a/Maa06aPanels.tsx')
          maa.write_text('\n'.join(line.rstrip() for line in maa.read_text().splitlines()) + '\n')

          p = Path('supabase/migrations/20261007195500_multi_topic_study_sessions.sql')
          text = p.read_text()
          needle = "create index if not exists study_session_topics_owner_topic_idx\n  on public.study_session_topics(owner_id, topic_id);\n"
          addition = needle + "\ncreate index if not exists study_session_topics_topic_idx\n  on public.study_session_topics(topic_id);\n"
          if 'study_session_topics_topic_idx' not in text:
              if needle not in text:
                  raise SystemExit('Could not locate multi-topic index insertion point')
              text = text.replace(needle, addition, 1)
              p.write_text(text)
          PY

          rm -f .github/workflows/bi05-merge-diagnose.yml
          rm -f .github/workflows/bi05-resolve-main.yml
          git add -A
          git diff --check --cached

      - name: Verify merged tree
        run: |
          npm install --no-package-lock
          npm test
          npm run build

      - name: Commit resolved merge
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m "Merge current main into BI05 release branch"
          git push origin HEAD:feature/bi05-iiris5-course-system
