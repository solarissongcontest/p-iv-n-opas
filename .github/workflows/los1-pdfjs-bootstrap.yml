name: LOS1 PDF.js Lockfile Bootstrap

on:
  push:
    branches:
      - feat/los1-pdfjs-reader
    paths:
      - ".github/workflows/los1-pdfjs-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-lockfile:
    if: github.ref == 'refs/heads/feat/los1-pdfjs-reader'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Pin PDF.js and regenerate native Bun lockfile
        run: |
          bun install --frozen-lockfile
          bun add --exact pdfjs-dist@5.7.284
          bun install --frozen-lockfile
      - name: Commit dependency and discard one-shot bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/los1-pdfjs-bootstrap.yml
          git add package.json bun.lock .github/workflows/los1-pdfjs-bootstrap.yml
          git commit -m "build(los1): lock pdfjs-dist 5.7.284 for local worker bundling"
          git push origin HEAD:refs/heads/feat/los1-pdfjs-reader
