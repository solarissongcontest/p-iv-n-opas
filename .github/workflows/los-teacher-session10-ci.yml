name: LOS! 1 Teacher Session 10 Quality Gate

on:
  pull_request:
    paths:
      - "src/features/los/**"
      - "tests/los-teacher-l056-l060.test.ts"
      - "e2e/los-session10.spec.ts"
      - ".github/workflows/los-teacher-session10-ci.yml"
  push:
    branches:
      - "feat/los1-teacher-l056-l060"
    paths:
      - "src/features/los/**"
      - "tests/los-teacher-l056-l060.test.ts"
      - "e2e/los-session10.spec.ts"
      - ".github/workflows/los-teacher-session10-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-10:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test lesson evidence, assessment, archive and backup regressions
        run: |
          node --experimental-strip-types --test \
            tests/los-teacher-l056-l060.test.ts \
            tests/los-final-exam-l059-l060.test.ts \
            tests/los-exam-attempt-archive.test.ts \
            tests/los-teacher-backup.test.ts \
            tests/los-review-ii-l056-l058.test.ts \
            tests/los-teacher-content-validation.test.ts

      - name: Install Playwright runner and browser engines
        run: |
          bun run e2e:install
          bunx playwright install --with-deps chromium webkit

      - name: Start local preview
        shell: bash
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-session10-vite.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:5173/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/los-session10-vite.log
          exit 1

      - name: E2E exam flows, resume, backup, summary and responsive layouts
        run: bunx playwright test e2e/los-session10.spec.ts --project=desktop-chromium --project=iphone-webkit

      - name: Attach browser traces on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: los-session10-browser-traces
          path: |
            test-results/
            /tmp/los-session10-vite.log
          if-no-files-found: ignore
          retention-days: 14
