name: Final Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production URL to verify. Leave empty to use the repository variable or Vercel default."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  wait-for-production:
    needs:
      - code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
    steps:
      - name: Resolve production URL
        id: resolve
        shell: bash
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url || '' }}
          REPOSITORY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          if [ -n "$INPUT_BASE_URL" ]; then
            URL="$INPUT_BASE_URL"
          elif [ -n "$REPOSITORY_BASE_URL" ]; then
            URL="$REPOSITORY_BASE_URL"
          else
            URL="https://opiskelupaivakirja.vercel.app"
          fi
          URL="${URL%/}"
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Testing $URL"

      - name: Wait for this exact commit to reach production
        shell: bash
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS_BODY=$(curl --silent --show-error --fail               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/status" || true)
            VERCEL_STATE=$(printf '%s' "$STATUS_BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((s.get('state','') for s in d.get('statuses',[]) if s.get('context')=='Vercel'),''))" 2>/dev/null || true)
            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ]; then
              echo "::error::Vercel deployment status is $VERCEL_STATE for $EXPECTED_SHA. Failing immediately instead of polling stale production."
              exit 1
            fi

            BODY=$(curl --silent --show-error --fail --max-time 10 "$BASE_URL/api/release-info" || true)
            LIVE_SHA=$(printf '%s' "$BODY" | python3 -c "import json,sys; print((json.load(sys.stdin).get('commit') or '').strip())" 2>/dev/null || true)
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Production is serving $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt/60: Vercel='${VERCEL_STATE:-unknown}', live commit='${LIVE_SHA:-unknown}', waiting for $EXPECTED_SHA"
            sleep 10
          done
          echo "::error::Production never reported the expected commit $EXPECTED_SHA"
          exit 1

  production-e2e:
    needs:
      - wait-for-production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: ${{ needs.wait-for-production.outputs.base_url }}
      REQUIRE_GEMINI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser test tooling
        run: npm run e2e:install

      - name: Install browser engines
        run: npx playwright install --with-deps webkit chromium

      - name: iPhone WebKit smoke and deep-link test
        run: npx playwright test e2e/iphone-smoke.spec.ts --project=iphone-webkit

      - name: Desktop production, WCAG and push backend checks
        run: npx playwright test e2e/release-gate.spec.ts --project=desktop-chromium

      - name: Offline reload and second-device synchronization
        run: npx playwright test e2e/v5-cross-device.spec.ts --project=desktop-chromium

      - name: Responsive layout evidence matrix
        run: npx playwright test e2e/responsive-visual.spec.ts --project=desktop-chromium

      - name: Detect committed visual baselines
        id: visual_baselines
        shell: bash
        run: |
          if find e2e/visual-regression.spec.ts-snapshots -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Committed visual baselines found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Visual baselines are not committed yet. Generate them with the exact-commit baseline workflow before enabling this release gate."
          fi

      - name: Visual regression against committed baselines
        if: steps.visual_baselines.outputs.available == 'true'
        run: npx playwright test e2e/visual-regression.spec.ts --project=desktop-chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-browser-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
