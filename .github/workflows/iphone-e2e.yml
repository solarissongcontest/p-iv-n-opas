name: Final Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production URL to verify. Leave empty to use the repository variable or Vercel default."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  wait-for-production:
    needs:
      - code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
    steps:
      - name: Wait for Vercel deployment result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/status"
          for attempt in $(seq 1 60); do
            JSON=$(curl --silent --show-error --fail \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API")
            VERCEL_STATE=$(printf '%s' "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); s=next((x for x in d.get('statuses',[]) if x.get('context')=='Vercel'),{}); print(s.get('state',''))")
            VERCEL_DESCRIPTION=$(printf '%s' "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); s=next((x for x in d.get('statuses',[]) if x.get('context')=='Vercel'),{}); print(s.get('description',''))")

            if [ "$VERCEL_STATE" = "success" ]; then
              echo "Vercel deployment completed."
              exit 0
            fi
            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ]; then
              echo "::error::Vercel deployment failed: $VERCEL_DESCRIPTION"
              exit 1
            fi

            echo "Attempt $attempt/60: Vercel state '${VERCEL_STATE:-not-created-yet}'."
            sleep 10
          done

          echo "::error::Timed out waiting for Vercel deployment status."
          exit 1

      - name: Resolve live production URL
        id: resolve
        shell: bash
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          REPOSITORY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_BASE_URL" ]; then
            CANDIDATES="$INPUT_BASE_URL"
          elif [ -n "$REPOSITORY_BASE_URL" ]; then
            CANDIDATES="$REPOSITORY_BASE_URL"
          else
            CANDIDATES="https://opiskelupaivakirja.vercel.app https://opiskelupaivakirja-aeldevahlberg-8169.vercel.app"
          fi

          for attempt in $(seq 1 30); do
            for URL in $CANDIDATES; do
              URL="${URL%/}"
              BODY=$(curl --silent --show-error --fail --max-time 10 "$URL/api/release-info" || true)
              LIVE_SHA=$(printf '%s' "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('commit') or '').strip())" 2>/dev/null || true)
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                echo "base_url=$URL" >> "$GITHUB_OUTPUT"
                echo "Production URL verified: $URL"
                exit 0
              fi
            done
            echo "Attempt $attempt/30: deployment succeeded, waiting for a production alias to serve $EXPECTED_SHA."
            sleep 10
          done

          echo "::error::Vercel succeeded but no configured/default production URL served the expected commit. Set the repository variable PRODUCTION_BASE_URL."
          exit 1

  production-e2e:
    needs:
      - wait-for-production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: ${{ needs.wait-for-production.outputs.base_url }}
      REQUIRE_GEMINI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser test tooling
        run: npm run e2e:install

      - name: Install browser engines
        run: npx playwright install --with-deps webkit chromium

      - name: iPhone WebKit smoke and deep-link test
        run: npx playwright test e2e/iphone-smoke.spec.ts --project=iphone-webkit

      - name: Desktop production, WCAG, Gemini and push backend checks
        run: npx playwright test e2e/release-gate.spec.ts --project=desktop-chromium

      - name: Offline reload and second-device synchronization
        run: npx playwright test e2e/v5-cross-device.spec.ts --project=desktop-chromium

      - name: Responsive visual layout regression matrix
        run: npx playwright test e2e/responsive-visual.spec.ts --project=desktop-chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-browser-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
