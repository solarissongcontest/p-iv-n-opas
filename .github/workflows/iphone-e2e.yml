name: Final Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production or deployment URL to verify. Empty uses the repository variable or the Vercel default."
        required: false
        type: string
      require_gemini:
        description: "Require a live Gemini response instead of local fallback."
        required: true
        default: true
        type: boolean
      send_push_test:
        description: "Send one real Web Push test to active subscriptions."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  wait-for-production:
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
    steps:
      - name: Resolve production URL
        id: resolve
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          REPOSITORY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        shell: bash
        run: |
          URL="${INPUT_BASE_URL:-${REPOSITORY_BASE_URL:-https://opiskelupaivakirja.vercel.app}}"
          URL="${URL%/}"
          echo "base_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Testing ${URL}"

      - name: Wait for this exact commit to reach Vercel
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            BODY="$(curl --silent --show-error --fail --max-time 10 "${BASE_URL}/api/release-info" || true)"
            LIVE_SHA="$(printf '%s' "$BODY" | python3 -c 'import json,sys
try:
    print((json.load(sys.stdin).get("commit") or "").strip())
except Exception:
    print("")')"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Production is serving $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt/60: live commit is '${LIVE_SHA:-unknown}', waiting for $EXPECTED_SHA"
            sleep 10
          done
          echo "::error::Production never reported the expected commit $EXPECTED_SHA"
          exit 1

  production-e2e:
    needs: wait-for-production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: ${{ needs.wait-for-production.outputs.base_url }}
      REQUIRE_GEMINI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_gemini == false && 'false' || 'true' }}
      SEND_PUSH_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_push_test == true && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps webkit chromium

      - name: iPhone WebKit smoke and deep-link test
        run: npx playwright test e2e/iphone-smoke.spec.ts --project=iphone-webkit

      - name: Desktop production, WCAG, Gemini and push backend checks
        run: npx playwright test e2e/release-gate.spec.ts --project=desktop-chromium

      - name: Offline reload and second-device synchronization
        run: npx playwright test e2e/v5-cross-device.spec.ts --project=desktop-chromium

      - name: Responsive visual layout regression matrix
        run: npx playwright test e2e/responsive-visual.spec.ts --project=desktop-chromium

      - name: Optional real Web Push delivery
        if: ${{ env.SEND_PUSH_TEST == 'true' }}
        run: npx playwright test e2e/push-delivery.spec.ts --project=desktop-chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-browser-evidence-${{ github.run_id }}
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 30
