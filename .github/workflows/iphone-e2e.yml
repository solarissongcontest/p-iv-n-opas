name: Final Release Gate

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production URL to verify. Leave empty to use the repository variable or Vercel default."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reuse upstream Quality Gate result
        if: github.event_name == 'workflow_run'
        run: echo "Automatic release certification follows a successful main Quality Gate."

      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        if: github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from committed Bun lockfile
        if: github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile

      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: bun run lint

      - name: Unit and regression tests
        if: github.event_name == 'workflow_dispatch'
        run: bun run test

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch'
        run: bun run typecheck

      - name: Production build
        if: github.event_name == 'workflow_dispatch'
        run: bun run build

  wait-for-production:
    needs:
      - code-quality
    if: >-
      ${{ always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && needs.code-quality.result == 'success')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
      expected_sha: ${{ steps.resolve.outputs.expected_sha }}
    steps:
      - name: Resolve production URL and release commit
        id: resolve
        shell: bash
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url || '' }}
          REPOSITORY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -n "$INPUT_BASE_URL" ]; then
            URL="$INPUT_BASE_URL"
          elif [ -n "$REPOSITORY_BASE_URL" ]; then
            URL="$REPOSITORY_BASE_URL"
          else
            URL="https://opiskelupaivakirja.vercel.app"
          fi
          URL="${URL%/}"
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Testing $URL at commit $RELEASE_SHA"

      - name: Wait for this exact commit to reach production
        shell: bash
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          EXPECTED_SHA: ${{ steps.resolve.outputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS_BODY=$(curl --silent --show-error --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/status" || true)
            VERCEL_STATE=$(printf '%s' "$STATUS_BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((s.get('state','') for s in d.get('statuses',[]) if s.get('context')=='Vercel'),''))" 2>/dev/null || true)
            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ]; then
              echo "::error::Vercel deployment status is $VERCEL_STATE for $EXPECTED_SHA. Failing immediately instead of polling stale production."
              exit 1
            fi

            BODY=$(curl --silent --show-error --fail --max-time 10 "$BASE_URL/api/release-info" || true)
            LIVE_SHA=$(printf '%s' "$BODY" | python3 -c "import json,sys; print((json.load(sys.stdin).get('commit') or '').strip())" 2>/dev/null || true)
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "Production is serving $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt/60: Vercel='${VERCEL_STATE:-unknown}', live commit='${LIVE_SHA:-unknown}', waiting for $EXPECTED_SHA"
            sleep 10
          done
          echo "::error::Production never reported the expected commit $EXPECTED_SHA"
          exit 1

  production-e2e:
    needs:
      - wait-for-production
    if: ${{ always() && needs.wait-for-production.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: ${{ needs.wait-for-production.outputs.base_url }}
      REQUIRE_GEMINI: "false"
    steps:
      - name: Checkout certified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.wait-for-production.outputs.expected_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Install browser test tooling
        run: bun run e2e:install

      - name: Install browser engines
        run: bunx playwright install --with-deps webkit chromium

      - name: iPhone WebKit smoke and deep-link test
        run: bunx playwright test e2e/iphone-smoke.spec.ts --project=iphone-webkit

      - name: Desktop production, WCAG and push backend checks
        run: bunx playwright test e2e/release-gate.spec.ts --project=desktop-chromium

      - name: Offline reload and second-device synchronization
        run: bunx playwright test e2e/v5-cross-device.spec.ts --project=desktop-chromium

      - name: Responsive layout evidence matrix
        run: bunx playwright test e2e/responsive-visual.spec.ts --project=desktop-chromium

      - name: Mobile progress layout and trajectory containment
        run: bunx playwright test e2e/progress-mobile-layout.spec.ts e2e/progress-trajectory.spec.ts --project=desktop-chromium

      - name: Detect committed visual baselines
        id: visual_baselines
        shell: bash
        run: |
          if find e2e/visual-regression.spec.ts-snapshots -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Committed visual baselines found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Visual baselines are not committed yet. Generate them with the exact-commit baseline workflow before enabling this release gate."
          fi

      - name: Visual regression against committed baselines
        if: steps.visual_baselines.outputs.available == 'true'
        run: bunx playwright test e2e/visual-regression.spec.ts --project=desktop-chromium

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-browser-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
