name: Apply KE04 planner diagnostic fix

on:
  push:
    branches:
      - fix/ke04-diagnostic-planner-state
    paths:
      - .github/workflows/apply-ke04-planner-diagnostic-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/ke04-diagnostic-planner-state
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply source patch
        run: python3 scripts/apply-ke04-planner-diagnostic-fix.py

      - name: Update source-level regression expectations
        run: python3 scripts/apply-ke04-test-expectations.py

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run unit and regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/practice/PracticeView.tsx src/lib/domain.ts src/lib/data.ts tests/ke04-planner-diagnostic-regression.test.ts tests/finnish-ui.test.ts tests/learning-v5.test.ts
          git diff --cached --check
          git commit -m "Fix topic diagnostics and planner future-state scheduling"
          git push origin HEAD:fix/ke04-diagnostic-planner-state
