name: Verify Cross Device Fix

on:
  push:
    branches:
      - fix-cross-device-final-gate-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://opiskelupaivakirja.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run e2e:install
      - run: npx playwright install --with-deps chromium
      - name: Cross-device production verification
        run: npx playwright test e2e/v5-cross-device.spec.ts --project=desktop-chromium
