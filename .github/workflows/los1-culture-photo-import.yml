name: LOS1 four curated culture photos (temporary import)

on:
  push:
    branches:
      - feat/los1-culture-photos-four-real-places
    paths:
      - "scripts/los1-optimize-culture-photos.py"
      - ".github/workflows/los1-culture-photo-import.yml"

permissions:
  contents: write

jobs:
  import-four-pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<12"
      - name: Import only four hand-selected Pexels images
        run: python scripts/los1-optimize-culture-photos.py
      - name: Check all eight WebP variants and provenance JSON
        shell: bash
        run: |
          test "$(find public/los/culture -maxdepth 1 -name '*-desktop.webp' | wc -l)" -eq 4
          test "$(find public/los/culture -maxdepth 1 -name '*-mobile.webp' | wc -l)" -eq 4
          test -s public/los/culture/sources-manifest.json
      - name: Commit downloaded and verified image binaries to this branch
        shell: bash
        run: |
          git config user.name "LOS Culture Assets Bot"
          git config user.email "los-culture-assets@users.noreply.github.com"
          git add public/los/culture/
          if git diff --cached --quiet; then
            echo "All verified photo variants are already committed."
          else
            git commit -m "assets(los1): self-host four cultural photos in eight WebP variants"
            git push origin HEAD:feat/los1-culture-photos-four-real-places
          fi
