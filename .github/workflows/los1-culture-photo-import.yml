name: LOS1 seven culture images (temporary import)

on:
  push:
    branches:
      - feat/los1-culture-photos-04-07-09
    paths:
      - "scripts/los1-optimize-culture-photos.py"
      - ".github/workflows/los1-culture-photo-import.yml"

permissions:
  contents: write

jobs:
  import-seven-pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<12"
      - name: Import seven individually selected Pexels photos
        run: python scripts/los1-optimize-culture-photos.py
      - name: Verify local asset output
        shell: bash
        run: |
          test "$(find public/los/culture -maxdepth 1 -name '*-desktop.webp' | wc -l)" -eq 7
          test "$(find public/los/culture -maxdepth 1 -name '*-mobile.webp' | wc -l)" -eq 7
          test -s public/los/culture/sources-manifest.json
      - name: Commit fourteen optimized images to PR branch
        shell: bash
        run: |
          git config user.name "LOS Culture Assets Bot"
          git config user.email "los-culture-assets@users.noreply.github.com"
          git add public/los/culture/
          if git diff --cached --quiet; then
            echo "All optimized cultural images already committed."
          else
            git commit -m "assets(los1): store seven sourced cultural photos as fourteen local WebP files"
            git push origin HEAD:feat/los1-culture-photos-04-07-09
          fi
