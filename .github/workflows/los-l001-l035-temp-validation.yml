name: LOS Teacher L001-L035 integration validation

on:
  push:
    branches:
      - feat/los1-teacher-integrated-l001-l035-20261113

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Node unit tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        run: bun run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      E2E_BASE_URL: http://127.0.0.1:5173
      REQUIRE_GEMINI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run e2e:install
      - run: bunx playwright install --with-deps chromium webkit
      - name: Start localhost
        shell: bash
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/los-l035-dev.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:5173/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/los-l035-dev.log
          exit 1
      - name: C06 C04 Review I on desktop Chromium and iPhone WebKit
        run: bunx playwright test e2e/los-c06-teacher.spec.ts e2e/los-c04-teacher.spec.ts e2e/los-teacher-review-midterm.spec.ts --project=desktop-chromium --project=iphone-webkit
      - name: C05 and all 60 lesson navigation both projects
        run: bunx playwright test e2e/los-full-book.spec.ts --grep 'C05|every one of the 60 guided lessons' --project=desktop-chromium --project=iphone-webkit
