name: Quality Gate

on:
  push:
    branches: [main, checklist-compliance]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "solarissongcontest/p-iv-n-opas" ]; then
            echo "::error::This workflow belongs only to solarissongcontest/p-iv-n-opas. Refusing to build from $GITHUB_REPOSITORY."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint # deterministic equivalent of npm run lint

      - name: Coach policy and API tests
        run: bun run test # deterministic equivalent of npm test

      - name: Typecheck
        run: bun run typecheck # deterministic equivalent of npm run typecheck

      - name: Build
        run: bun run build # deterministic equivalent of npm run build

  vercel-build-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Build with Bun
        run: bun run build

  los-browser-smoke:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/los-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright test runner
        run: bun run e2e:install
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start local app
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > /tmp/los-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/los > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/los-vite.log
          exit 1
      - name: Browser test LOS! desktop and mobile
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: bunx playwright test e2e/los-v33.spec.ts --project=desktop-chromium
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: los-v33-browser-traces
          path: test-results/
          if-no-files-found: ignore
