name: Quality Gate

on:
  push:
    branches: [main, checklist-compliance]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "solarissongcontest/p-iv-n-opas" ]; then
            echo "::error::This workflow belongs only to solarissongcontest/p-iv-n-opas. Refusing to build from $GITHUB_REPOSITORY."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Coach policy and API tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build


  vercel-build-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Build with Bun
        run: bun run build
